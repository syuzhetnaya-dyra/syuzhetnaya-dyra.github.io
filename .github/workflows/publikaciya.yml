# Сборка и публикация сайта на GitHub Pages.
#
# В репозитории лежат исходники, а не готовый сайт: одиннадцать страниц
# собираются из данных. Поэтому публикация — это не «положить файлы», а
# «собрать и положить». Делает это GitHub сам, на каждый коммит в main.
#
# BASE_PATH здесь не задан намеренно: репозиторий называется так же, как
# организация, плюс .github.io, и по этому совпадению Pages кладёт сайт в
# корень домена. Корень — это значение по умолчанию в astro.config.
#
# Если сайт когда-нибудь переедет в подпапку — например, станет обычным
# проектным репозиторием, — достаточно вернуть сюда BASE_PATH с адресом
# подпапки. Больше править нечего: своего корня в коде не записано нигде.
#
# SITE_URL нужен только карточке ссылки в мессенджерах: og:image обязан быть
# абсолютным, относительный путь они не подхватят.

name: Публикация сайта

on:
  push:
    branches: [main]
  # Кнопка «собрать сейчас» во вкладке Actions — на случай, когда нужно
  # пересобрать без коммита.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две сборки разом подрались бы за публикацию. Побеждает последняя: она
# собрана из более свежего кода.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sborka:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build
        env:
          # Ключ выпуска шифрует платные страницы. Он не лежит в
          # репозитории — только здесь, секретом. Если секрета нет,
          # сборка НАРОЧНО падает: выложить платное в открытом виде
          # хуже, чем не выложить ничего.
          KLYUCH_VYPUSKA: ${{ secrets.KLYUCH_VYPUSKA }}
        env:
          SITE_URL: https://syuzhetnaya-dyra.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publikaciya:
    name: Публикация
    needs: sborka
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
